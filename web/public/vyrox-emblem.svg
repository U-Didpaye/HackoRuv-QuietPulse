<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vyrox-chrome-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E5E5E5"/>
      <stop offset="50%" stop-color="#8E8E93"/>
      <stop offset="75%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <linearGradient id="vyrox-chrome-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C7C7CC"/>
      <stop offset="70%" stop-color="#48484A"/>
      <stop offset="100%" stop-color="#18181A"/>
    </linearGradient>
    <linearGradient id="vyrox-sheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A1A1AA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Outer Facets -->
  <polygon points="200,40 320,130 270,300 200,360 130,300 80,130" fill="none" stroke="url(#vyrox-chrome-1)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Left Monolith Wing -->
  <path d="M 110,130 L 200,320 L 200,240 L 140,110 Z" fill="url(#vyrox-chrome-1)" filter="url(#subtle-glow)"/>

  <!-- Right Monolith Wing -->
  <path d="M 290,130 L 200,320 L 200,240 L 260,110 Z" fill="url(#vyrox-chrome-2)"/>

  <!-- Inner Razor Core Chevron -->
  <polygon points="200,90 235,160 200,270 165,160" fill="url(#vyrox-sheen)" opacity="0.95"/>
  
  <!-- Central Precision Spine -->
  <line x1="200" y1="75" x2="200" y2="335" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
</svg>
