name: Build QuietPulse Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble QuietPulse Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuietPulse-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release for Direct APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-release-${{ github.run_number }}
          name: QuietPulse v1.0.0 (Build ${{ github.run_number }})
          body: |
            # 🛡️ QuietPulse — LESS NOISE. MORE FOCUS.
            ### Official Native Android Application Release

            **Made With Creativity By HackoRuv - Team**

            #### Direct Download & Installation
            Download the attached `QuietPulse-debug.apk` and open it on your physical Android phone to install immediately:
            - **Package**: `QuietPulse-debug.apk`
            - **Target**: Android 8.0+ (API 26+)
            - **Architecture**: 100% On-Device Attention Firewall
            - **Features**: NotiFy Engine, FlowQueue Digest, DeepFocus Timer, PulseInsights Telemetry, 5 Handcrafted Themes, and Real NotificationListenerService integration.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
