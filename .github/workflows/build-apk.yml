name: Build FocusShield AI Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusShield-AI-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release for Direct APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: FocusShield AI v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 🛡️ FocusShield AI — CASCADE '26 Release
            Problem 3.1: The Attention Firewall (IIIT Nagpur)

            ### Direct APK Download
            Download and install `FocusShield-AI-debug.apk` directly on any Android 8.0+ device.
            * Verified offline-first on-device intelligence
            * Real NotificationListenerService integration
            * Interactive Demo Lab for Hackathon Judges
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
